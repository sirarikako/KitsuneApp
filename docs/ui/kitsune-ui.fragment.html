    function attachLedgerScroll(position, collapsed, compact){
      const main=phone.querySelector('.ks-ledger-screen .ks-main');
      if(!main)return;
      const parts=[...phone.querySelectorAll('.ks-ledger-screen .ks-ledger-collapsible')];
      const fab=phone.querySelector('.ks-ledger-fab');
      let sizes=[],height=0,previous=position;
      const layout=()=>{
        const visible=height?1-collapsed/height:1;
        parts.forEach((part,i)=>{
          part.style.height=`${sizes[i]*visible}px`;
          part.inert=visible===0;
        });
        fab?.classList.toggle('ks-fab-compact',compact);
      };
      const measure=()=>{
        sizes=parts.map(part=>part.firstElementChild.offsetHeight);
        height=sizes.reduce((sum,size)=>sum+size,0);
        collapsed=Math.min(height,collapsed);
        layout();
      };
      measure();
      main.scrollTop=position;
      previous=main.scrollTop;
      main.addEventListener('scroll',()=>{
        const current=main.scrollTop,delta=current-previous;
        if(!delta)return;
        collapsed=current<=0?0:Math.min(height,Math.max(0,collapsed+delta));
        compact=current>0;
        layout();
        // A taller viewport may clamp the scroll offset at the end.
        previous=main.scrollTop;
      },{passive:true});
      const observer=new ResizeObserver(()=>{
        if(!main.isConnected){observer.disconnect();return;}
        measure();
        previous=main.scrollTop;
      });
      parts.forEach(part=>observer.observe(part.firstElementChild));
    }

        function calcCents(expression){
      const source=expression.replace(/×/g,'*').replace(/[−–]/g,'-').replace(/÷/g,'/').replace(/\s/g,'');
      if(source.length>80||!/^\d+(?:\.\d*)?(?:[+*/-]\d+(?:\.\d*)?)*$/.test(source))throw Error('请补全金额或计算式，例如 12+8×2。');
      const tokens=source.match(/\d+(?:\.\d*)?|[+*/-]/g);
      const parse=s=>{const [a,b='']=s.split('.');return [BigInt(a+b),10n**BigInt(b.length)];};
      const op=(a,b,o)=>{if(o==='+')return[a[0]*b[1]+b[0]*a[1],a[1]*b[1]];if(o==='-')return[a[0]*b[1]-b[0]*a[1],a[1]*b[1]];if(o==='*')return[a[0]*b[0],a[1]*b[1]];if(!b[0])throw Error('不能除以 0，请修改计算式。');return[a[0]*b[1],a[1]*b[0]];};
      const sums=[];let term=parse(tokens[0]);for(let i=1;i<tokens.length;i+=2){if(tokens[i]==='*'||tokens[i]==='/')term=op(term,parse(tokens[i+1]),tokens[i]);else{sums.push(term,tokens[i]);term=parse(tokens[i+1]);}}sums.push(term);let result=sums[0];for(let i=1;i<sums.length;i+=2)result=op(result,sums[i+1],sums[i]);
      if(result[0]<=0n)throw Error('金额需大于 0。');
      if(!entryWallet())throw Error('请先选择钱包。');const factor=10n**BigInt(entryWallet().scale),cents=(result[0]*factor*2n+result[1])/(result[1]*2n);
      if(cents<=0n)throw Error('金额四舍五入后必须大于 0。');
      if(cents>maximumEntryMinor)throw Error('超出单笔金额上限，请减小金额。');
      return cents;
    }

    const refreshHomeMeal=()=>{if(state.page==='home'&&phone.querySelector('[data-home-meal]')?.dataset.meal!==String(recommendedSlot()))render();};
    const mealTimer=setInterval(refreshHomeMeal,60000);
    window.addEventListener('focus',refreshHomeMeal);
    window.addEventListener('pagehide',()=>clearInterval(mealTimer),{once:true});
    if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{applyStyle();if(state.page==='home')render();}});tweak.addColorPicker(style,'customColor',{label:'自选主色（自选模式）',reference:'--ks-seed'});tweak.addSelect(style,'mode',{label:'明暗模式',options:[{label:'跟随系统',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});tweak.addSelect(style,'mealHour',{label:'首页餐次预览',options:[{label:'跟随当前时间',value:'auto'},{label:'早餐时段',value:'8'},{label:'午餐时段',value:'12'},{label:'晚餐时段',value:'19'}]});}
  }
})();
</script>
